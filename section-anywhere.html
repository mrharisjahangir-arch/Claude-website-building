<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section — Prepare anywhere (design-loop working file)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E; --ink-d:#0E1729;
    --blue:#5B7EBD; --blue-d:#3E5D97; --blue-l:#8CA6D6;
    --lav:#A78FC0; --lav-d:#8B70A8; --lav-l:#C4B3D8;
    --mist:#F3F5FA; --slate:#4B5468; --line:#E3E6F0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;}
  h2{font-family:'Manrope',sans-serif;letter-spacing:-0.01em;margin:0;}

  /* ============================================================
     SECTION SHELL
     M6 — one flat background colour, not white, unmodulated.
     ============================================================ */
  .anywhere{
    position:relative;
    background:var(--mist);
    overflow:hidden;
    padding:104px 20px 112px;
    isolation:isolate;
  }

  /* ============================================================
     CENTRE COLUMN
     M4 — the centre third is the text island; no object enters it.
     M7 — headline is the only large type on the frame.
     ============================================================ */
  .centre{
    position:relative; z-index:3;
    max-width:760px; margin:0 auto; text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; font-weight:600; letter-spacing:.2em;
    color:var(--blue-d); margin:0 0 20px;
  }
  .headline{
    font-size:clamp(2.4rem,5.4vw,3.75rem);
    font-weight:800; line-height:1.06; letter-spacing:-0.022em;
    color:var(--ink);
  }
  .sub{
    margin:22px auto 0; max-width:470px;
    font-size:1.0625rem; line-height:1.65; color:var(--slate);
  }
  .cta-row{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn-primary{
    background:var(--ink); color:#fff; border-radius:9999px;
    padding:14px 30px; font-weight:600; font-size:.9375rem;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    transition:background .25s ease;
  }
  .btn-primary:hover{background:var(--blue-d);}
  .btn-primary .arrow{display:inline-block;transition:transform .2s ease;}
  .btn-primary:hover .arrow{transform:translateX(3px);}
  .btn-outline{
    background:transparent; color:var(--ink); border:1.5px solid var(--ink);
    border-radius:9999px; padding:14px 30px; font-weight:600; font-size:.9375rem;
    text-decoration:none; display:inline-flex; align-items:center;
    transition:background .25s ease,color .25s ease;
  }
  .btn-outline:hover{background:var(--ink);color:#fff;}

  /* ============================================================
     SCATTERED FIELD
     Three nested layers keep concerns separate:
       .obj       — position + entrance (opacity/scale)
       .obj-rot   — the M5 base rotation, never animated
       .obj-drift — the M8/M9 idle drift
     ============================================================ */
  /* The field never spans the full width. It is split into two gutters that
     are defined as whatever is left over once the text corridor is reserved:
     calc(50% - 420px) each side of a 760px-max text column plus breathing room.
     M4 is therefore structural — an object cannot reach the text, because the
     box it lives in stops before the text begins. */
  .field{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .gutter{position:absolute;top:0;bottom:0;width:calc(50% - 420px);}
  .gutter-l{left:0;}
  .gutter-r{right:0;}

  .obj{
    position:absolute;
    opacity:0;
    transform:scale(.82);
    animation:enter var(--in,560ms) cubic-bezier(.34,1.56,.64,1) var(--in-delay,0ms) forwards;
  }
  @keyframes enter{ to{ opacity:1; transform:scale(1); } }

  .obj-rot{display:block;}

  .obj-drift{
    display:block;
    animation:drift var(--dur,5s) ease-in-out var(--delay,0s) infinite;
    will-change:transform;
  }
  @keyframes drift{
    0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
    50%    { transform:translate3d(var(--dx,4px),var(--dy,-9px),0) rotate(var(--dr,2deg)); }
  }

  .obj svg{display:block;}

  /* Characters sit above the small props but below the text. */
  .figure{z-index:2;}

  /* ============================================================
     RESPONSIVE
     Below 1200px the gutters are too narrow to hold a scatter without
     the objects reaching the text. Rather than shrink them into an
     unreadable smear, the field stops being a scatter and becomes a
     grounded illustration band beneath the copy. M4 is upheld by
     changing the layout, not by abandoning the composition.
     ============================================================ */
  @media (max-width:1199px){
    .anywhere{padding:84px 20px 0; display:flex; flex-direction:column;}
    .centre{order:1;}
    .field{
      order:2;
      position:static; display:flex; align-items:flex-end; justify-content:center;
      gap:clamp(4px,3vw,40px); margin-top:52px;
    }
    .gutter{position:static; width:auto; display:contents;}
    .obj{position:static; animation:enter var(--in,560ms) cubic-bezier(.34,1.56,.64,1) var(--in-delay,0ms) forwards;}
    /* Only the two characters and two supporting props survive the fold. */
    .obj:not(.figure):not([data-keep]){display:none;}
    .obj[data-keep]{align-self:center;}
    .figure svg{width:clamp(132px,25vw,210px);height:auto;}
    .obj[data-keep] svg{width:clamp(34px,6vw,60px);height:auto;}
  }
  @media (max-width:640px){
    .anywhere{padding:68px 18px 0;}
    .field{gap:0;}
    .obj[data-keep]{display:none;}
    .figure svg{width:clamp(128px,38vw,176px);}
  }

  /* ============================================================
     M11 — reduced motion. Everything resolves to its rest state.
     ============================================================ */
  @media (prefers-reduced-motion:reduce){
    .obj{opacity:1;transform:none;animation:none;}
    .obj-drift{animation:none;}
    .btn-primary,.btn-outline,.btn-primary .arrow{transition:none;}
  }
</style>
</head>
<body>

<section class="anywhere" aria-labelledby="anywhere-title">

  <!-- ==========================================================
       SPRITE SHEET — every object and character defined once.
       M1: each form = one flat base fill + one darker shadow fill.
       No strokes, no gradients, no outlines anywhere in here.
       ========================================================== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>

      <!-- ---------- PROPS ---------- -->

      <symbol id="p-book" viewBox="0 0 64 64">
        <rect x="14" y="10" width="38" height="44" rx="5" fill="#5B7EBD"/>
        <rect x="14" y="10" width="11" height="44" rx="5" fill="#3E5D97"/>
        <rect x="31" y="21" width="16" height="3.4" rx="1.7" fill="#C4B3D8"/>
        <rect x="31" y="29" width="11" height="3.4" rx="1.7" fill="#C4B3D8"/>
      </symbol>

      <symbol id="p-flask" viewBox="0 0 64 64">
        <path d="M27 9h10v17l11 21a7 7 0 0 1-6 10H22a7 7 0 0 1-6-10l11-21z" fill="#C4B3D8"/>
        <path d="M32 9h5v17l11 21a7 7 0 0 1-6 10h-10z" fill="#A78FC0"/>
        <path d="M21 39h22l5 8a7 7 0 0 1-6 10H22a7 7 0 0 1-6-10z" fill="#5B7EBD"/>
        <path d="M32 39h11l5 8a7 7 0 0 1-6 10h-10z" fill="#3E5D97"/>
        <rect x="24" y="5" width="16" height="6" rx="3" fill="#8CA6D6"/>
      </symbol>

      <symbol id="p-clipboard" viewBox="0 0 64 64">
        <rect x="12" y="9" width="40" height="48" rx="6" fill="#8CA6D6"/>
        <rect x="32" y="9" width="20" height="48" rx="6" fill="#5B7EBD"/>
        <rect x="24" y="4" width="16" height="9" rx="4" fill="#16213E"/>
        <path d="M21 27l4 4 7-8" fill="none" stroke="#16213E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 41l4 4 7-8" fill="none" stroke="#16213E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="37" y="26" width="10" height="3.2" rx="1.6" fill="#F3F5FA"/>
        <rect x="37" y="40" width="10" height="3.2" rx="1.6" fill="#F3F5FA"/>
      </symbol>

      <symbol id="p-phone" viewBox="0 0 64 64">
        <rect x="17" y="5" width="30" height="54" rx="8" fill="#16213E"/>
        <rect x="32" y="5" width="15" height="54" rx="8" fill="#0E1729"/>
        <rect x="21" y="11" width="22" height="42" rx="4" fill="#F3F5FA"/>
        <circle cx="32" cy="30" r="10" fill="#C4B3D8"/>
        <path d="M32 30V22" stroke="#8B70A8" stroke-width="3" stroke-linecap="round"/>
        <path d="M32 30l6 4" stroke="#8B70A8" stroke-width="3" stroke-linecap="round"/>
      </symbol>

      <symbol id="p-cap" viewBox="0 0 64 64">
        <path d="M32 13 60 26 32 39 4 26z" fill="#5B7EBD"/>
        <path d="M32 13 60 26 32 39z" fill="#3E5D97"/>
        <path d="M17 31v11c0 5 7 9 15 9s15-4 15-9V31l-15 7z" fill="#8CA6D6"/>
        <path d="M32 38v13c8 0 15-4 15-9V31z" fill="#5B7EBD"/>
        <rect x="57" y="26" width="4" height="17" rx="2" fill="#16213E"/>
      </symbol>

      <!-- Brain echoes the MindMed logo: split down the middle,
           one half pale, one half lavender. -->
      <symbol id="p-brain" viewBox="0 0 64 64">
        <path d="M32 9c-12 0-21 8-21 19 0 5 2 9 5 12-1 7 3 14 11 16v5h10v-5c8-2 12-9 11-16 3-3 5-7 5-12 0-11-9-19-21-19z" fill="#C4B3D8"/>
        <path d="M32 9c12 0 21 8 21 19 0 5-2 9-5 12 1 7-3 14-11 16v5h-5z" fill="#A78FC0"/>
        <path d="M32 11v50" stroke="#8B70A8" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M20 23c4-3 8-2 10 2M20 35c4-3 8-2 10 2M44 23c-4-3-8-2-10 2M44 35c-4-3-8-2-10 2" fill="none" stroke="#8B70A8" stroke-width="2.2" stroke-linecap="round"/>
      </symbol>

      <symbol id="p-bubble" viewBox="0 0 64 64">
        <path d="M12 14h40a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H30l-12 9v-9h-6a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="#8CA6D6"/>
        <path d="M32 14h20a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H32z" fill="#5B7EBD"/>
        <circle cx="22" cy="30" r="3.2" fill="#F3F5FA"/>
        <circle cx="32" cy="30" r="3.2" fill="#F3F5FA"/>
        <circle cx="42" cy="30" r="3.2" fill="#F3F5FA"/>
      </symbol>

      <symbol id="p-steth" viewBox="0 0 64 64">
        <path d="M18 8v13a12 12 0 0 0 24 0V8" fill="none" stroke="#5B7EBD" stroke-width="5" stroke-linecap="round"/>
        <path d="M30 33v6a11 11 0 0 0 22 0v-4" fill="none" stroke="#3E5D97" stroke-width="5" stroke-linecap="round"/>
        <circle cx="30" cy="33" r="6" fill="#8CA6D6"/>
        <circle cx="52" cy="30" r="7" fill="#16213E"/>
        <circle cx="52" cy="30" r="3.4" fill="#5B7EBD"/>
        <rect x="14" y="4" width="8" height="7" rx="3.5" fill="#16213E"/>
        <rect x="38" y="4" width="8" height="7" rx="3.5" fill="#16213E"/>
      </symbol>

      <symbol id="p-chart" viewBox="0 0 64 64">
        <rect x="8" y="12" width="48" height="40" rx="6" fill="#F3F5FA"/>
        <rect x="32" y="12" width="24" height="40" rx="6" fill="#E3E6F0"/>
        <rect x="16" y="32" width="7" height="13" rx="3.5" fill="#C4B3D8"/>
        <rect x="27" y="25" width="7" height="20" rx="3.5" fill="#8CA6D6"/>
        <rect x="38" y="19" width="7" height="26" rx="3.5" fill="#5B7EBD"/>
      </symbol>

      <symbol id="p-pencil" viewBox="0 0 64 64">
        <rect x="26" y="6" width="12" height="40" rx="3" fill="#A78FC0"/>
        <rect x="32" y="6" width="6" height="40" rx="3" fill="#8B70A8"/>
        <path d="M26 46h12l-6 11z" fill="#F0D2BB"/>
        <path d="M32 46h6l-6 11z" fill="#DCB89E"/>
        <path d="M30 53l2 4 2-4z" fill="#16213E"/>
        <rect x="26" y="6" width="12" height="6" rx="3" fill="#5B7EBD"/>
      </symbol>

      <!-- ---------- CHARACTERS ----------
           M2: no necks, capsule limbs, head ~1/3 of body, dot eyes only.
           M3: each one is using a prop.
      -->

      <!-- Cross-legged, holding an open book up at chest height.
           Draw order: legs → torso → head → hair → arms → book → hands,
           so the arms and the prop both sit in front and the pose reads. -->
      <symbol id="c-reader" viewBox="0 0 200 230">
        <!-- crossed shins: two capsules forming an X -->
        <rect x="42" y="180" width="116" height="27" rx="13.5" fill="#16213E" transform="rotate(-9 100 193)"/>
        <rect x="42" y="180" width="116" height="27" rx="13.5" fill="#0E1729" transform="rotate(10 100 193)"/>
        <!-- torso -->
        <rect x="67" y="98" width="66" height="88" rx="29" fill="#5B7EBD"/>
        <path d="M100 98h4c16 0 29 13 29 29v30c0 16-13 29-29 29h-4z" fill="#3E5D97"/>
        <!-- head -->
        <circle cx="100" cy="60" r="35" fill="#F0D2BB"/>
        <path d="M100 25a35 35 0 0 1 0 70z" fill="#DCB89E"/>
        <!-- hair: side-parted, sits on the crown -->
        <path d="M100 22c-21 0-36 15-36 33 0 4 1 8 2 11 1-15 5-23 12-26 9 12 33 14 48 5 5 4 7 11 8 21 2-4 2-7 2-11 0-18-15-33-36-33z" fill="#16213E"/>
        <path d="M100 22c21 0 36 15 36 33 0 4 0 7-2 11-1-10-3-17-8-21-7 4-16 6-26 5z" fill="#0E1729"/>
        <!-- eyes -->
        <circle cx="88" cy="66" r="3.7" fill="#16213E"/>
        <circle cx="112" cy="66" r="3.7" fill="#16213E"/>
        <!-- open book, held up and clearly readable -->
        <g transform="rotate(-5 100 156)">
          <path d="M58 130h42v52H66a8 8 0 0 1-8-8z" fill="#C4B3D8"/>
          <path d="M142 130h-42v52h34a8 8 0 0 0 8-8z" fill="#A78FC0"/>
          <path d="M100 130v52" stroke="#8B70A8" stroke-width="3"/>
          <rect x="68" y="142" width="24" height="4" rx="2" fill="#F3F5FA"/>
          <rect x="68" y="153" width="18" height="4" rx="2" fill="#F3F5FA"/>
          <rect x="68" y="164" width="21" height="4" rx="2" fill="#F3F5FA"/>
          <rect x="110" y="142" width="24" height="4" rx="2" fill="#F3F5FA"/>
          <rect x="110" y="153" width="18" height="4" rx="2" fill="#F3F5FA"/>
          <rect x="110" y="164" width="21" height="4" rx="2" fill="#F3F5FA"/>
        </g>
        <!-- arms drawn OVER the book, reaching down to grip its outer edges,
             so the limbs stay visible and the pose reads as holding -->
        <rect x="46" y="108" width="19" height="56" rx="9.5" fill="#3E5D97" transform="rotate(-28 55.5 136)"/>
        <rect x="135" y="108" width="19" height="56" rx="9.5" fill="#3E5D97" transform="rotate(28 144.5 136)"/>
        <!-- hands gripping the outer edges of the book -->
        <circle cx="61" cy="158" r="11" fill="#F0D2BB"/>
        <circle cx="139" cy="154" r="11" fill="#DCB89E"/>
      </symbol>

      <!-- Kneeling tutor, stethoscope round the neck, holding a clipboard up
           in one hand and gesturing with the other — mid-explanation. -->
      <symbol id="c-mentor" viewBox="0 0 200 230">
        <!-- tucked legs -->
        <path d="M50 202c1-16 22-27 50-27s49 11 50 27c0 6-6 8-14 8H64c-8 0-14-2-14-8z" fill="#3E5D97"/>
        <path d="M100 175c28 0 49 11 50 27 0 6-6 8-14 8h-36z" fill="#2F4877"/>
        <!-- torso -->
        <rect x="68" y="96" width="64" height="86" rx="28" fill="#A78FC0"/>
        <path d="M100 96h4c15 0 28 13 28 28v30c0 15-13 28-28 28h-4z" fill="#8B70A8"/>
        <!-- head -->
        <circle cx="100" cy="58" r="35" fill="#C98D68"/>
        <path d="M100 23a35 35 0 0 1 0 70z" fill="#B0764F"/>
        <!-- hair: short crop -->
        <path d="M100 20c-22 0-37 14-37 32 0 4 0 7 2 10 2-12 8-18 16-20 10 7 29 8 42 1 6 3 10 8 12 19 1-3 2-6 2-10 0-18-15-32-37-32z" fill="#3A2A22"/>
        <path d="M100 20c22 0 37 14 37 32 0 4-1 7-2 10-2-11-6-16-12-19-7 4-15 6-23 6z" fill="#2A1D17"/>
        <!-- eyes -->
        <circle cx="88" cy="64" r="3.7" fill="#16213E"/>
        <circle cx="112" cy="64" r="3.7" fill="#16213E"/>
        <!-- stethoscope worn round the neck -->
        <path d="M79 96c0 19 9 31 21 31s21-12 21-31" fill="none" stroke="#16213E" stroke-width="6" stroke-linecap="round"/>
        <circle cx="121" cy="129" r="9" fill="#16213E"/>
        <circle cx="121" cy="129" r="4.2" fill="#5B7EBD"/>
        <!-- left arm down and out, carrying the clipboard at its side -->
        <rect x="48" y="110" width="19" height="58" rx="9.5" fill="#8B70A8" transform="rotate(-22 57.5 139)"/>
        <!-- right arm raised, open palm — mid-explanation -->
        <rect x="133" y="94" width="19" height="56" rx="9.5" fill="#8B70A8" transform="rotate(30 142.5 122)"/>
        <!-- clipboard carried at the side, small enough to read as a prop -->
        <g transform="rotate(-13 42 172)">
          <rect x="22" y="146" width="40" height="50" rx="6" fill="#8CA6D6"/>
          <rect x="42" y="146" width="20" height="50" rx="6" fill="#5B7EBD"/>
          <rect x="34" y="141" width="16" height="8" rx="4" fill="#16213E"/>
          <path d="M29 163l3.4 3.4 6-6.8" fill="none" stroke="#16213E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M29 179l3.4 3.4 6-6.8" fill="none" stroke="#16213E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="45" y="162" width="12" height="3.4" rx="1.7" fill="#F3F5FA"/>
          <rect x="45" y="178" width="12" height="3.4" rx="1.7" fill="#F3F5FA"/>
        </g>
        <!-- hands: one on the clipboard, one raised open -->
        <circle cx="46" cy="166" r="11" fill="#C98D68"/>
        <circle cx="158" cy="106" r="12" fill="#B0764F"/>
      </symbol>

    </defs>
  </svg>

  <!-- ==========================================================
       THE FIELD — objects live in the outer thirds only (M4).
       Rotations span -41deg..+38deg and never repeat within 15deg
       of a neighbour; scale spans 46px..104px, >2x (M5).
       Drift periods are non-harmonic (M9): 3.1 3.7 4.3 4.7 5.3
       5.9 6.1 6.7 7.0 — no two share a common multiple nearby.
       ========================================================== -->
  <div class="field" aria-hidden="true">

    <!-- ---- LEFT GUTTER — all offsets are % of the gutter, not the page ---- -->
    <div class="gutter gutter-l">

      <div class="obj" style="left:14%; top:11%; --in-delay:60ms;">
        <span class="obj-rot" style="transform:rotate(-17deg)">
          <span class="obj-drift" style="--dur:5.3s;--delay:.0s;--dx:5px;--dy:-10px;--dr:2.4deg;">
            <svg width="82" height="82"><use href="#p-book"/></svg>
          </span></span>
      </div>

      <div class="obj" data-keep style="left:54%; top:30%; --in-delay:170ms;">
        <span class="obj-rot" style="transform:rotate(24deg)">
          <span class="obj-drift" style="--dur:3.7s;--delay:.4s;--dx:-6px;--dy:-7px;--dr:-3deg;">
            <svg width="54" height="54"><use href="#p-brain"/></svg>
          </span></span>
      </div>

      <div class="obj" style="left:3%; top:47%; --in-delay:120ms;">
        <span class="obj-rot" style="transform:rotate(-38deg)">
          <span class="obj-drift" style="--dur:6.7s;--delay:.9s;--dx:7px;--dy:8px;--dr:3.2deg;">
            <svg width="66" height="66"><use href="#p-flask"/></svg>
          </span></span>
      </div>

      <div class="obj" style="left:62%; top:61%; --in-delay:300ms;">
        <span class="obj-rot" style="transform:rotate(9deg)">
          <span class="obj-drift" style="--dur:4.3s;--delay:.2s;--dx:-4px;--dy:-9px;--dr:2deg;">
            <svg width="48" height="48"><use href="#p-pencil"/></svg>
          </span></span>
      </div>

      <div class="obj" style="left:58%; top:6%; --in-delay:380ms;">
        <span class="obj-rot" style="transform:rotate(33deg)">
          <span class="obj-drift" style="--dur:5.9s;--delay:1.1s;--dx:5px;--dy:7px;--dr:-2.6deg;">
            <svg width="46" height="46"><use href="#p-cap"/></svg>
          </span></span>
      </div>

      <div class="obj figure" style="left:6%; bottom:0; --in-delay:220ms;">
        <span class="obj-rot" style="transform:rotate(-4deg)">
          <span class="obj-drift" style="--dur:7.0s;--delay:.6s;--dx:0px;--dy:-6px;--dr:.8deg;">
            <svg width="196" height="225"><use href="#c-reader"/></svg>
          </span></span>
      </div>

    </div>

    <!-- ---- RIGHT GUTTER ---- -->
    <div class="gutter gutter-r">

      <div class="obj" style="right:12%; top:9%; --in-delay:90ms;">
        <span class="obj-rot" style="transform:rotate(21deg)">
          <span class="obj-drift" style="--dur:4.7s;--delay:.3s;--dx:-6px;--dy:-9px;--dr:-2.8deg;">
            <svg width="76" height="76"><use href="#p-phone"/></svg>
          </span></span>
      </div>

      <div class="obj" data-keep style="right:52%; top:26%; --in-delay:200ms;">
        <span class="obj-rot" style="transform:rotate(-29deg)">
          <span class="obj-drift" style="--dur:6.1s;--delay:.7s;--dx:6px;--dy:-6px;--dr:3deg;">
            <svg width="58" height="58"><use href="#p-bubble"/></svg>
